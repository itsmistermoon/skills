name: skill sync

on:
  push:
    paths:
      - "skills/wiki-radiant/**"
      - ".claude-plugin/**"
      - ".github/workflows/skill-sync.yml"
  pull_request:
    paths:
      - "skills/wiki-radiant/**"
      - ".claude-plugin/**"
      - ".github/workflows/skill-sync.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/wiki-radiant
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint dependencies
        run: |
          python -m pip install -r skills/wiki-lint/scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
      - name: Check skill consistency
        run: bash scripts/check-skill-sync.sh
      - name: Check behavior
        run: python -B -m unittest discover -s tests -v
